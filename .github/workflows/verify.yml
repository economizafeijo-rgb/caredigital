name: Verify CareDigital

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run all project tests
        run: bun run test
      - name: Compile production site
        if: always()
        run: bun run build
