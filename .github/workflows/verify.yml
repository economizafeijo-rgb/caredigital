name: Verify CareDigital

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run care scheduling and health metrics tests
        run: bunx vitest run src/lib/care-schedule.test.ts src/lib/health-metrics.test.ts src/lib/care-history.test.ts src/lib/hydration-goal.test.ts src/lib/care-reminders.test.ts src/lib/client-pages.test.ts src/components/vigia/ClientTodayTimeline.test.ts
      - name: Compile production site
        run: bun run build
